  我又梦到他了，我陪他去上学。
  <br/>
  我们肩并肩，沿着小河边走，穿过立交桥，走了很远很远。
  <br/>
  他的脸颊是含糊不清的，他比我矮一些，和我并排走的时候，微微靠在我身上。
  <br/>
  他说他喜欢我。
  <br/>
  他说，之前说过的那些事情都是假的。
  <br/>
  我问他：“今天天气怎么样？”
  <br/>
  他说：“不好。”
  <br/>
  我又问他：“最近怎么样？”
  <br/>
  他说：“学习挺忙的。”
  <br/>
  于是，我们走到了学校，我看着他走进大门，走进人群里，再也看不到了。
