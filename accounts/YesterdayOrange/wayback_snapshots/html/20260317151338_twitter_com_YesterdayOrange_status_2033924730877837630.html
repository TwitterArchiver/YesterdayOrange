  我的枕头丢了。
  <br/>
  它有点脏，蓝色的斑点，黄色的污渍。
  <br/>
  我睡了半年。
  <br/>
  我把枕头和别人一起去洗，找不到了。
  <br/>
  我起床的时候经常看着他，然后想起“清晨，从与理想搏斗的失败中醒来”
  <br/>
  现在我更失败了。
  <br/>
  在洗衣房翻了七个塑料袋，只有别人发霉的衣服。
  <br/>
  于是我回到宿舍。
  <br/>
  枕头压在舍友的枕头下，左边小，右边大。
