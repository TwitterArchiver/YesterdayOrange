<style type="text/css">
body {
				margin:0;

				background-color: #000;

			}
  .notice {
    border: 2px solid #c9ae00;

    padding: 12px;

    top: 20px;
    z-index: 1000;
  }

  .tweet-container {

    flex-direction: column;
    justify-content: center;
    align-items: center;
    max-width: max-content;
  }

  .tweet-container > #nonjsonview {
    max-width: 600px;
    margin-left: auto;

  }

  .tweet-author {
    display: flex;
    flex-direction: row;
    align-items: center;
    padding-bottom: 0.75rem;
  }

  .tweet-author-profile-image img {

    max-width: 48px;
    height: 48px;
    max-height: 48px;

    border-radius: 50%;

  }

  .tweet-author-info {
    display: flex;
    flex-direction: column;
  }

  .tweet-author-name {
    font-weight: bold;
  }

  .tweet-content {
    font-size: 1.25rem;
  }

			.tweet-image {
				width: 100%;
				height: auto;

				border-radius: 12px;
			}

			.tweet-article {

				border-radius: 12px;
			}
			.tweet-article-label {
				font-size: 0.75rem;
				font-weight: bold;
				text-transform: uppercase;
				letter-spacing: 0.05em;
				color: #657786;
				margin-bottom: 8px;
			}
			.tweet-article-title {
				font-size: 1.5rem;

				margin-bottom: 8px;
			}
			.tweet-article-text {

			.embedded-tweet-container {

				text-decoration: none;
			}

			}
  .on {
    display: block;
  }

<div class="tweet-container on">

  </div>
  <div class="tweet-author-username">

  </div>
  </div>
  </div>
  <div class="tweet-content">
  给你两个 版本号字符串 version1 和 version2 ，请你比较它们。版本号由被点 '.' 分开的修订号组成。修订号的值 是它 转换为整数 并忽略前导零。
  <br/>
  <br/>
  比较版本号时，请按 从左到右的顺序 依次比较它们的修订号。如果其中一个版本字符串的修订号较少，则将缺失的修订号视为 0。
  <br/>
  <br/>
  返回规则如下：
  <br/>
  <br/>
  如果 version1 &lt; version2 返回 -1，
  <br/>
  如果 version1 &gt; version2 返回 1，
  <br/>
  除此之外返回 0。
  <!-- If there's a quoted tweet, embed it here!-->
  <p class="date">
  <a href="/" id="parentdate">
  </a>
  </p>
  </div>
</div>
</div>
<script>
var dateString = "2026-08-31T06:41:31.000Z";
  var date = new Date(dateString);
  var currentURL = window.location.href;
  document.querySelector("#parentdate").innerText = date;
  document.querySelector("#parentdate").href = currentURL;
</script>
